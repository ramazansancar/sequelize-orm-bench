# Local Sequelize v7 builds (builds/<name>/*.tgz, see builds/README.md) vs stock @sequelize/core. sequelize7:*@pg expands to every folder in builds/.
#   docker compose -f compose.builds.yml run --rm bench
# Override with SIDES, ROUNDS, DURATION (seconds per side), CONC, e.g.
#   SIDES=sequelize7:main@pg,sequelize7:my-branch@pg ROUNDS=1 DURATION=10 docker compose -f compose.builds.yml run --rm bench
# Results: the table on stdout, raw JSON lines in ./results/.
include:
  - docker-compose.yml

services:
  bench:
    build: .
    image: sequelize-orm-bench:runner
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
    volumes:
      - ./results:/app/results
      - ./builds:/app/builds
    command: >
      sh -c "node builds.mjs &&
      node seed.mjs --if-needed &&
      node run.mjs '${SIDES:-sequelize7@pg,sequelize7:*@pg}' ${ROUNDS:-3} ${DURATION:-20} ${CONC:-12}"
