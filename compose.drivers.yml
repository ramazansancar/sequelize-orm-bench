# pg vs pg-native (libpq), and Sequelize's ORM path vs its raw sequelize.query() path, on PostgreSQL 17.
#   docker compose -f compose.drivers.yml run --rm bench
# Override with SIDES, ROUNDS, DURATION (seconds per side), CONC, e.g.
#   SIDES=pg@pg,pg-native@pg ROUNDS=1 DURATION=10 docker compose -f compose.drivers.yml run --rm bench
# Results: the table on stdout, raw JSON lines in ./results/.
include:
  - docker-compose.yml

services:
  bench:
    build: .
    image: sequelize-orm-bench:runner
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
    volumes:
      - ./results:/app/results
    command: >
      sh -c "node seed.mjs --if-needed &&
      node run.mjs '${SIDES:-pg@pg,pg-native@pg,sequelize6@pg,sequelize6-native@pg,sequelize6-raw@pg,sequelize7@pg,sequelize7-native@pg,sequelize7-raw@pg,typeorm@pg,typeorm-native@pg,knex@pg,knex-native@pg}' ${ROUNDS:-3} ${DURATION:-20} ${CONC:-12}"
