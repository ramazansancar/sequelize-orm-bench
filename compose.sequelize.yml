# Sequelize v6 vs @sequelize/core v7 vs plain pg on PostgreSQL 17.
#   docker compose -f compose.sequelize.yml run --rm bench
# Override with SIDES, ROUNDS, DURATION (seconds per side), CONC, e.g.
#   SIDES=sequelize7@pg,pg@pg ROUNDS=1 DURATION=10 docker compose -f compose.sequelize.yml run --rm bench
# Results: the table on stdout, raw JSON lines in ./results/.
include:
  - docker-compose.yml

services:
  bench:
    build: .
    image: sequelize-orm-bench:runner
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
    volumes:
      - ./results:/app/results
    command: >
      sh -c "node seed.mjs --if-needed &&
      node run.mjs '${SIDES:-sequelize6@pg,sequelize7@pg,pg@pg}' ${ROUNDS:-3} ${DURATION:-20} ${CONC:-12}"
